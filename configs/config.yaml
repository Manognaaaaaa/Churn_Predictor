# Single source of truth for paths, datasets, seeds, thresholds and budgets.
# v1: Churn_Modelling (10k bank customers) chosen against the README hard rules
# (real labels, revenue-ish value per customer, behavioural features, >=10k customers).
# Neither dataset carries timestamps -> snapshot_frequency is "static" and splits are
# stratified instead of time-based (documented deviation, see reports/model_card.md).
seed: 42

active_dataset: churn_modelling

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  artifacts: artifacts
  reports: reports
  test_probs: artifacts/test_probs.parquet   # Step 8: per-model test-split probabilities

datasets:
  churn_modelling:
    path: data/raw/Churn_Modelling.csv
    id_col: CustomerId
    label_col: Exited
    value_col: EstimatedSalary   # customer value proxy for revenue-at-risk (documented)
    currency: "EUR"
    drop_cols: [RowNumber, Surname]
    categorical: [Geography, Gender]
    numeric: [CreditScore, Age, Tenure, Balance, NumOfProducts, HasCrCard, IsActiveMember, EstimatedSalary]
  telco:
    path: data/raw/Telco_customer_churn.xlsx
    id_col: CustomerID
    label_col: Churn Value
    value_col: Monthly Charges   # true recurring revenue
    currency: "USD"
    drop_cols: [Count, Country, State, City, Zip Code, Lat Long, Latitude, Longitude,
                Churn Label, Churn Score, Churn Reason, CLTV]
    categorical: [Gender, Senior Citizen, Partner, Dependents, Phone Service, Multiple Lines,
                  Internet Service, Online Security, Online Backup, Device Protection,
                  Tech Support, Streaming TV, Streaming Movies, Contract, Paperless Billing,
                  Payment Method]
    numeric: [Tenure Months, Monthly Charges, Total Charges]

windows:
  snapshot_frequency: static    # "monthly" once a temporal dataset is available
  observation_months: 6
  prediction_horizon_months: 3
  split_fractions:              # stratified by label (no timestamps -> no time split)
    train: 0.70
    valid: 0.15
    test: 0.15
  cv_folds: 4                   # stratified k-fold stand-in for expanding-window CV

models:
  xgb:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
  rf:
    n_estimators: 400
    min_samples_leaf: 5
  logreg_map_C: 1.0             # L2 strength -> MAP estimate
  calibration:
    methods: [platt, isotonic]
    ece_bins: 15
  threshold:
    offer_cost_frac: 0.10       # retention offer costs ~10% of customer value
    offer_uplift: 0.30          # offer cuts that customer's churn risk by ~30%
  lstm:
    seq_len: 6                  # synthetic temporal augmentation length (see model card)
    hidden: 64
    epochs: 12
    batch_size: 256
    lr: 0.001

forecast:
  # Step 9: real revenue series (UCI Online Retail II, weekly). The series is a UK gift wholesaler,
  # NOT the bank customers of the churn model; the forecast is portfolio revenue, the churn model
  # supplies the share of revenue at risk (formulas below). Weekly points keep the parquet column
  # name `month` (it holds the week-ending Sunday); the /forecast response carries a `freq` field.
  source: online_retail           # online_retail | telco_reconstruction
  freq: W-SUN                     # weeks ending Sunday (use MS for monthly)
  currency: "GBP"
  holdout: 8                      # last h points held out (8 weeks; 4 if monthly)
  horizon: 12                     # steps forecast beyond the last observation
  ci_level: 0.95
  seasonal_period: 52             # weeks per year (12 if monthly)
  adf:
    alpha: 0.05                   # d = smallest differencing order whose ADF p-value < alpha
    regression: c
    max_d: 2
  acf_lags: 26                    # lags shown in the ACF/PACF plots
  order_grid:                     # (p, q) ranges, inclusive; d comes from the ADF step; AIC on train
    p: [0, 3]
    q: [0, 3]
  seasonal_grid:                  # used only if the fitted part holds >= min_cycles full cycles
                                  # (3: two cycles cannot separate seasonality from noise nor identify seasonal ARMA terms)
    min_cycles: 3
    P: [0, 1]
    Q: [0, 1]
    D: 1
  ljung_box_lags: [8, 16]
  ma_windows: [2, 4, 8, 12, 26]   # candidate moving-average windows, chosen on the training part
  ma_select_origins: 8            # origins inside the training part used to choose the window
  rolling:
    origins: 10                   # expanding-window origins ending at the last full holdout
    step: 4                       # points between consecutive origins
  figures:
    acf_pacf: reports/figures/acf_pacf.png
    residual_acf: reports/figures/residual_acf.png
    scenarios: reports/figures/forecast_scenarios.png
  # Scenario formulas (Phase 9.2). L is computed on the churn test split with calibrated p:
  #   L  = sum_i p_i v_i / sum_i v_i                     expected churn loss rate
  #   L' = L - (expected revenue saved by the Step 8 segment-aware, offer-snapped allocation) / sum_i v_i
  #   no_intervention = forecast * (1 - L)
  #   with_allocation = forecast * (1 - L')              so with_allocation >= no_intervention
  # ---- candidate real series (Phase 9.0). `source` is chosen after the 9.0 checkpoint. ----
  sources:
    telco_reconstruction:         # revenue rebuilt from tenure x Monthly Charges (survivorship-biased)
      path: data/raw/Telco_customer_churn.xlsx
      tenure_col: Tenure Months
      charge_col: Monthly Charges
      snapshot_month: "2019-06"   # the file has no calendar date: assumed snapshot month (assumption)
      months: 72
      freq: MS
    online_retail:                # UCI Online Retail II, real dated invoices
      path: data/raw/online_retail_II.xlsx
      cache: data/interim/online_retail_ii.parquet
      drop_invoice_prefix: "C"    # cancellations
      min_quantity: 0             # keep Quantity > this
      min_price: 0                # keep Price > this
  choice_report:
    adf_regression: c             # ADF with constant
    seasonal_period: {MS: 12, W-SUN: 52}
    decomposition_model: additive

budget:
  total: 100000
  currency: "EUR"
  max_spend_per_customer: 500
  fn_cost_multiple: 4.0         # missing a churner costs ~4x an unnecessary offer

risk_bands:                     # on calibrated P(churn)
  green_max: 0.20
  amber_max: 0.50

segmentation:
  gmm_k_range: [2, 8]           # chosen by BIC
  value_tiers: [low, mid, high]

# ---- Step 8: segment-aware response curves --------------------------------------------
# r_i(x) = p_i * v_i * a_g * (1 - exp(-x / tau_i)),   tau_i = t_g * v_i,   g = (segment, value tier)
#   a_g = a * m_seg * m_tier        t_g = t * n_seg * n_tier
# We have NO treatment/uplift data: every number below is an assumption (see reports/allocation.md).
# Multipliers are derived by the written rule below, not tuned to make any strategy win.
allocation:
  dual_check_tolerance: 0.005    # KKT vs dual-ascent objective must agree within 0.5%
  response_curves:
    a: 0.30                       # default max fraction of at-risk revenue an offer can save
    t: 0.05                       # default saturation scale (tau = t * customer value)
    # Segment rule: engagement index e_s = mean over engagement_features of the z-score of the
    # segment's train-split mean (z taken ACROSS segments). m_seg = clip(1 + slope * e_s, lo, hi).
    # More engaged segments (active members, more products) respond more to offers.
    engagement_features: [IsActiveMember, NumOfProducts]
    a_segment_slope: 0.15
    a_segment_bounds: [0.5, 1.5]
    # No evidence that segments differ in how big an offer must be -> n_seg = 1 (slope 0).
    t_segment_slope: 0.0
    t_segment_bounds: [0.5, 1.5]
    # Tier rule: with tiers ordered low < mid < high, tier index k = -1, 0, +1 and
    # multiplier = step ** k. High-value customers need a bigger offer to move (t up by the step);
    # nothing suggests tiers differ in max response (a step 1.0).
    a_tier_step: 1.0
    t_tier_step: 1.25

  # ---- offer catalog (Step 8.2) -----------------------------------------------------
  # Stage 1 (KKT) decides spend x_i. Stage 2 picks, among the offers eligible for the customer's
  # (engagement class, value tier) group whose cost <= max_spend_per_customer, the cheapest one with
  # cost >= x_i (or the largest eligible one if none covers x_i). Spend is then the offer's real
  # cost and the budget is re-balanced so total spend <= B.
  # cost = flat + cost_frac * customer_value.  Costs and eligibility are assumptions (no uplift data).
  # Rule of thumb: disengaged groups need a human touch (service call); engaged groups respond to
  # money offers (retention bonus, value discount); cheap touches are open to everyone.
  engagement_split: 0.0           # segment engagement index > split -> "high" class, else "low"
  min_spend: 0.5                  # solved spend below this is treated as "not targeted"
  rebalance_max_iter: 40          # budget re-balancing rounds after offer snapping
  rebalance_tol: 0.001            # stop when snapped spend is within 0.1% of the budget
  offers:
    loyalty_email:   {flat: 5.0,   cost_frac: 0.0,   eligible: {tiers: [low, mid, high], engagement: [low, high]}}
    fee_waiver:      {flat: 25.0,  cost_frac: 0.0,   eligible: {tiers: [low, mid, high], engagement: [low, high]}}
    service_call:    {flat: 100.0, cost_frac: 0.0,   eligible: {tiers: [low, mid, high], engagement: [low]}}
    retention_bonus: {flat: 250.0, cost_frac: 0.0,   eligible: {tiers: [mid, high],      engagement: [high]}}
    value_discount:  {flat: 0.0,   cost_frac: 0.005, eligible: {tiers: [low, mid, high], engagement: [high]}}  # 0.5% of value

  # ---- evaluation of claim 2 (Step 8.3) ---------------------------------------------
  # Budgets below are PORTFOLIO budgets (all customers). A split is evaluated at
  # budget * (n_split / n_all) so spend per customer is the same as in production.
  eval_split: test
  budget_sweep: [10000, 25000, 50000, 100000, 200000, 400000, 700000, 1000000]
  bootstrap_resamples: 1000       # customer resamples for CIs on realized saved revenue
  bootstrap_level: 0.90

  # ---- calibration claim, sensitivity, rounds (Step 8.4-8.6) ---------------------------
  calibration_sources: [p_rf_isotonic, p_rf_platt, p_rf_raw, p_rf_smote_raw, p_naive_bayes_raw, p_xgboost_raw]
  sensitivity_levels: [-0.5, -0.25, 0.25, 0.5]   # relative change of each a_g and t_g
  rounds: 6                       # monthly reallocation rounds
  rounds_seeds: 200               # paired simulations for the rounds-vs-one-shot comparison
  rounds_interval: 0.90
  reason_response_band: 0.05      # a_g within +-5% of default a -> 'responds on par'
