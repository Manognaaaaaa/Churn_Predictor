# Single source of truth for paths, datasets, seeds, thresholds and budgets.
# v1: Churn_Modelling (10k bank customers) chosen against the README hard rules
# (real labels, revenue-ish value per customer, behavioural features, >=10k customers).
# Neither dataset carries timestamps -> snapshot_frequency is "static" and splits are
# stratified instead of time-based (documented deviation, see reports/model_card.md).
seed: 42

active_dataset: churn_modelling

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  artifacts: artifacts
  reports: reports

datasets:
  churn_modelling:
    path: data/raw/Churn_Modelling.csv
    id_col: CustomerId
    label_col: Exited
    value_col: EstimatedSalary   # customer value proxy for revenue-at-risk (documented)
    currency: "EUR"
    drop_cols: [RowNumber, Surname]
    categorical: [Geography, Gender]
    numeric: [CreditScore, Age, Tenure, Balance, NumOfProducts, HasCrCard, IsActiveMember, EstimatedSalary]
  telco:
    path: data/raw/Telco_customer_churn.xlsx
    id_col: CustomerID
    label_col: Churn Value
    value_col: Monthly Charges   # true recurring revenue
    currency: "USD"
    drop_cols: [Count, Country, State, City, Zip Code, Lat Long, Latitude, Longitude,
                Churn Label, Churn Score, Churn Reason, CLTV]
    categorical: [Gender, Senior Citizen, Partner, Dependents, Phone Service, Multiple Lines,
                  Internet Service, Online Security, Online Backup, Device Protection,
                  Tech Support, Streaming TV, Streaming Movies, Contract, Paperless Billing,
                  Payment Method]
    numeric: [Tenure Months, Monthly Charges, Total Charges]

windows:
  snapshot_frequency: static    # "monthly" once a temporal dataset is available
  observation_months: 6
  prediction_horizon_months: 3
  split_fractions:              # stratified by label (no timestamps -> no time split)
    train: 0.70
    valid: 0.15
    test: 0.15
  cv_folds: 4                   # stratified k-fold stand-in for expanding-window CV

models:
  xgb:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
  rf:
    n_estimators: 400
    min_samples_leaf: 5
  logreg_map_C: 1.0             # L2 strength -> MAP estimate
  calibration:
    methods: [platt, isotonic]
    ece_bins: 15
  threshold:
    offer_cost: 50.0            # cost of targeting a customer who would have stayed
  lstm:
    seq_len: 6                  # synthetic temporal augmentation length (see model card)
    hidden: 64
    epochs: 12
    batch_size: 256
    lr: 0.001

forecast:
  months_ahead: 12
  history_months: 24
  baseline_window: 6            # moving-average baseline
  arima_order: [1, 1, 1]

budget:
  total: 100000
  currency: "EUR"
  max_spend_per_customer: 500
  fn_cost_multiple: 4.0         # missing a churner costs ~4x an unnecessary offer

risk_bands:                     # on calibrated P(churn)
  green_max: 0.20
  amber_max: 0.50

segmentation:
  gmm_k_range: [2, 8]           # chosen by BIC
  value_tiers: [low, mid, high]
