# Single source of truth for paths, datasets, seeds, thresholds and budgets.
# v1: Churn_Modelling (10k bank customers) chosen against the README hard rules
# (real labels, revenue-ish value per customer, behavioural features, >=10k customers).
# Neither dataset carries timestamps -> snapshot_frequency is "static" and splits are
# stratified instead of time-based (documented deviation, see reports/model_card.md).
seed: 42

active_dataset: churn_modelling

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  artifacts: artifacts
  reports: reports
  test_probs: artifacts/test_probs.parquet   # Step 8: per-model test-split probabilities

datasets:
  churn_modelling:
    path: data/raw/Churn_Modelling.csv
    id_col: CustomerId
    label_col: Exited
    value_col: EstimatedSalary   # customer value proxy for revenue-at-risk (documented)
    currency: "EUR"
    drop_cols: [RowNumber, Surname]
    categorical: [Geography, Gender]
    numeric: [CreditScore, Age, Tenure, Balance, NumOfProducts, HasCrCard, IsActiveMember, EstimatedSalary]
  telco:
    path: data/raw/Telco_customer_churn.xlsx
    id_col: CustomerID
    label_col: Churn Value
    value_col: Monthly Charges   # true recurring revenue
    currency: "USD"
    drop_cols: [Count, Country, State, City, Zip Code, Lat Long, Latitude, Longitude,
                Churn Label, Churn Score, Churn Reason, CLTV]
    categorical: [Gender, Senior Citizen, Partner, Dependents, Phone Service, Multiple Lines,
                  Internet Service, Online Security, Online Backup, Device Protection,
                  Tech Support, Streaming TV, Streaming Movies, Contract, Paperless Billing,
                  Payment Method]
    numeric: [Tenure Months, Monthly Charges, Total Charges]

windows:
  snapshot_frequency: static    # "monthly" once a temporal dataset is available
  observation_months: 6
  prediction_horizon_months: 3
  split_fractions:              # stratified by label (no timestamps -> no time split)
    train: 0.70
    valid: 0.15
    test: 0.15
  cv_folds: 4                   # stratified k-fold stand-in for expanding-window CV

models:
  xgb:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
  rf:
    n_estimators: 400
    min_samples_leaf: 5
  logreg_map_C: 1.0             # L2 strength -> MAP estimate
  calibration:
    methods: [platt, isotonic]
    ece_bins: 15
  threshold:
    offer_cost_frac: 0.10       # retention offer costs ~10% of customer value
    offer_uplift: 0.30          # offer cuts that customer's churn risk by ~30%
  lstm:
    seq_len: 6                  # synthetic temporal augmentation length (see model card)
    hidden: 64
    epochs: 12
    batch_size: 256
    lr: 0.001

forecast:
  months_ahead: 12
  history_months: 24
  baseline_window: 6            # moving-average baseline
  arima_order: [1, 1, 1]

budget:
  total: 100000
  currency: "EUR"
  max_spend_per_customer: 500
  fn_cost_multiple: 4.0         # missing a churner costs ~4x an unnecessary offer

risk_bands:                     # on calibrated P(churn)
  green_max: 0.20
  amber_max: 0.50

segmentation:
  gmm_k_range: [2, 8]           # chosen by BIC
  value_tiers: [low, mid, high]

# ---- Step 8: segment-aware response curves --------------------------------------------
# r_i(x) = p_i * v_i * a_g * (1 - exp(-x / tau_i)),   tau_i = t_g * v_i,   g = (segment, value tier)
#   a_g = a * m_seg * m_tier        t_g = t * n_seg * n_tier
# We have NO treatment/uplift data: every number below is an assumption (see reports/allocation.md).
# Multipliers are derived by the written rule below, not tuned to make any strategy win.
allocation:
  dual_check_tolerance: 0.005    # KKT vs dual-ascent objective must agree within 0.5%
  response_curves:
    a: 0.30                       # default max fraction of at-risk revenue an offer can save
    t: 0.05                       # default saturation scale (tau = t * customer value)
    # Segment rule: engagement index e_s = mean over engagement_features of the z-score of the
    # segment's train-split mean (z taken ACROSS segments). m_seg = clip(1 + slope * e_s, lo, hi).
    # More engaged segments (active members, more products) respond more to offers.
    engagement_features: [IsActiveMember, NumOfProducts]
    a_segment_slope: 0.15
    a_segment_bounds: [0.5, 1.5]
    # No evidence that segments differ in how big an offer must be -> n_seg = 1 (slope 0).
    t_segment_slope: 0.0
    t_segment_bounds: [0.5, 1.5]
    # Tier rule: with tiers ordered low < mid < high, tier index k = -1, 0, +1 and
    # multiplier = step ** k. High-value customers need a bigger offer to move (t up by the step);
    # nothing suggests tiers differ in max response (a step 1.0).
    a_tier_step: 1.0
    t_tier_step: 1.25
